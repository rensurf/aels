name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install -r requirements.txt ruff mypy --prerelease=allow

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Type check
        run: uv run --no-project mypy src/ --ignore-missing-imports

      - name: Test
        run: uv run pytest tests/unit/ -v

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Build deployment package
        run: |
          uv pip install -r requirements-deploy.txt --target package/ --prerelease=allow
          cp -r src/ package/src/
          cp src/main.py src/worker.py src/quiz_scheduler.py package/
          cd package && zip -r ../deploy.zip . -x "*.pyc" -x "__pycache__/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload package to S3
        run: |
          aws s3 cp deploy.zip s3://${{ secrets.DEPLOY_BUCKET }}/deploy-${{ github.sha }}.zip

      - name: Deploy code to Lambda
        run: |
          for fn in aels-teacher aels-worker aels-quiz-scheduler; do
            aws lambda update-function-code \
              --function-name "$fn" \
              --s3-bucket ${{ secrets.DEPLOY_BUCKET }} \
              --s3-key deploy-${{ github.sha }}.zip
          done

      - name: Update Lambda environment variables
        run: |
          ENV_VARS="Variables={\
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},\
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},\
          COSMOS_ENDPOINT=${{ secrets.COSMOS_ENDPOINT }},\
          COSMOS_KEY=${{ secrets.COSMOS_KEY }},\
          COSMOS_DATABASE=${{ secrets.COSMOS_DATABASE }},\
          COSMOS_GRAPH=${{ secrets.COSMOS_GRAPH }},\
          DYNAMODB_SESSION_TABLE=${{ secrets.DYNAMODB_SESSION_TABLE }},\
          SQS_WORKER_QUEUE_URL=${{ secrets.SQS_WORKER_QUEUE_URL }}}"

          for fn in aels-teacher aels-worker aels-quiz-scheduler; do
            aws lambda update-function-configuration \
              --function-name "$fn" \
              --environment "$ENV_VARS"
          done
